[package]
name = "yin_qi_dao"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "音栖岛：一款基于 GPUI 的音乐播放器"
license = "GPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"
members = [
    ".",
    "crates/lucide-gpui",
    "crates/audio-simd",
    "crates/audio-spatial",
    "crates/audio-codec-core",
    "crates/audio-codec-registry",
    "crates/audio-codec-avs3",
]

[workspace.dependencies]
gpui = { git = "https://github.com/Chlna6666/Better-Minecraft-Bedrock-Launcher.git", rev = "df66989bf612972dcc2e6107a943d197ddd463dc", default-features = false }
gpui_tokio = { git = "https://github.com/Chlna6666/Better-Minecraft-Bedrock-Launcher.git", rev = "df66989bf612972dcc2e6107a943d197ddd463dc" }

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.16"
crossbeam-channel = "0.5"
directories = "6"
encoding_rs = "0.8"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
lofty = "0.22"
mimalloc = { version = "0.1.52", default-features = false }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.17"
ringbuf = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rusty-chromaprint = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
symphonia = { version = "0.6.1", default-features = false, features = [
    "all-codecs",
    "all-formats",
    "all-meta",
] }
thiserror = "2"
wasmtime = { version = "=48.0.1", default-features = false, features = [
    "async",
    "cache",
    "component-model",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p2"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
lucide-gpui = { path = "crates/lucide-gpui" }
yinqidao-audio-simd = { path = "crates/audio-simd" }
yinqidao-audio-spatial = { path = "crates/audio-spatial" }
yinqidao-codec-core = { path = "crates/audio-codec-core" }
yinqidao-codec-avs3 = { path = "crates/audio-codec-avs3" }

gpui_tokio = { workspace = true }
souvlaki = "0.8.3"
gpui-router = "0.3.0"
rayon = "1.10"
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
gpui = { workspace = true, features = [
    "windows-manifest",
    "nova-gfx-dx12",
    "nova-gfx-vulkan",
    "build-shader-validation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = [
    "nova-gfx-metal",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = [
    "nova-gfx-vulkan",
    "wayland",
    "x11",
] }

# The GPUI branch's Nova DX12 path uses BMCBL's patched gpu-allocator report API.
# Keep this local bridge until that patch is published by the upstream branch.
[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }
gpui = { git = "https://github.com/Chlna6666/Better-Minecraft-Bedrock-Launcher.git", rev = "df66989bf612972dcc2e6107a943d197ddd463dc" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[dev-dependencies]

[profile.release]
# Desktop audio/UI workloads are latency-sensitive; optimize hot paths instead of binary size.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = 0

[profile.dev]
opt-level = 3
panic = "unwind"
