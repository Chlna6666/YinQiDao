[package]
name = "yinqidao-netease-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Keep the guest Component outside YinQiDao's desktop workspace. It has a different target,
# dependency graph and release profile, and should never be pulled into normal desktop checks.
[workspace]

[dependencies]
ncm2mp3-core = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wit-bindgen = "0.62.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = 0
