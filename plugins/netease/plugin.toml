package_schema = 1
component = "provider.wasm"

id = "io.yinqidao.netease"
name = "网易云音乐"
version = "0.1.0"
abi_version = 1
description = "YinQiDao 网易云音乐 Provider：Cookie 登录、搜索、歌词、封面、在线播放、歌单、云音乐库、喜欢同步、每日推荐、私人 FM、个性推荐与播放行为同步。"
homepage = "https://music.163.com"
network_domains = [
  "music.163.com",
  "interface.music.163.com",
  "*.music.126.net",
  "*.kuwo.cn",
  "*.sycdn.kuwo.cn",
  "*.kugou.com",
  "*.migu.cn",
  "*.gdstudio.xyz",
  "*.qijieya.cn",
  "*.msls1441.com",
]

[[providers]]
id = "netease"
display_name = "网易云音乐"
liked_tracks_readable = true
capabilities = [
  "authentication",
  "search",
  "metadata",
  "lyrics",
  "artwork",
  "streaming",
  "playlists",
  "media_collections",
  "cloud_library",
  "like_sync",
  "recommendations",
  "playback_events",
  "user_profile",
]
auth_methods = ["cookie_import", "qr_code", "custom_form"]
quality_profiles = [
  { id = "standard", label = "标准 · 128 kbps" },
  { id = "higher", label = "较高 · 192 kbps" },
  { id = "exhigh", label = "极高 · 320 kbps" },
  { id = "lossless", label = "无损 · FLAC" },
  { id = "hires", label = "Hi-Res" },
  { id = "jyeffect", label = "高清臻音" },
  { id = "jymaster", label = "超清母带" },
  { id = "sky", label = "沉浸环绕声" },
  { id = "dolby", label = "杜比全景声" },
  { id = "vivid", label = "臻音全景声" },
]
