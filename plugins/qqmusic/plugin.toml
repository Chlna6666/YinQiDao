package_schema = 1
component = "provider.wasm"

id = "io.yinqidao.qqmusic"
name = "QQ音乐"
version = "0.1.0"
abi_version = 1
description = "YinQiDao QQ音乐 Provider：QQ 扫码和 Cookie 导入、搜索、歌词、封面、在线播放、歌单、专辑与推荐。"
homepage = "https://y.qq.com"
network_domains = [
  "y.qq.com",
  "u.y.qq.com",
  "ssl.ptlogin2.qq.com",
  "ssl.ptlogin2.graph.qq.com",
  "graph.qq.com",
  "c.y.qq.com",
  "i.y.qq.com",
  "musicue.stream.qqmusic.qq.com",
  "*.qq.com",
  "*.gtimg.cn",
  "*.music.tc.qq.com",
  "dl.stream.qqmusic.qq.com",
  "isure.stream.qqmusic.qq.com",
  "aqqmusic.tc.qq.com",
]

[[providers]]
id = "qqmusic"
display_name = "QQ音乐"
liked_tracks_readable = true
capabilities = [
  "authentication",
  "search",
  "metadata",
  "lyrics",
  "artwork",
  "streaming",
  "playlists",
  "media_collections",
  "recommendations",
  "user_profile",
]
auth_methods = ["qr_code", "cookie_import"]
quality_profiles = [
  { id = "standard", label = "标准 · 128 kbps" },
  { id = "exhigh", label = "高品质 · 320 kbps" },
  { id = "lossless", label = "无损 · FLAC" },
]
