name: Update GPUI retained lock

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-gpui-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: github.event.head_commit.message == 'chore(ci): 生成 GPUI retained 修复锁文件'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve fixed GPUI commit
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p gpui --precise d546c984d6b53acf17b8717cabaffcdd57ad4e8d
          if grep -q 'f22192c79096d718b20a530209d5dfef41f7cc4c' Cargo.lock; then
            echo 'old GPUI source commit is still present in Cargo.lock' >&2
            exit 1
          fi
          grep -q 'd546c984d6b53acf17b8717cabaffcdd57ad4e8d' Cargo.lock
          git diff --exit-code -- Cargo.toml

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --quiet && {
            echo 'Cargo.lock did not change' >&2
            exit 1
          }
          git commit -m 'fix(ui): 同步 GPUI retained 裁剪上下文修复'
          git push origin HEAD:main
