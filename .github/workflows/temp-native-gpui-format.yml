name: Temporary native GPUI source formatting
on:
  push:
    paths:
      - .github/workflows/temp-native-gpui-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format edited native renderer and scene files
        run: cargo fmt --all
      - name: Commit canonical source formatting
        shell: bash
        run: |
          if ! git diff --quiet -- '*.rs'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style(gpu): rustfmt native GPUI scene and shader extension migration"
            git push origin HEAD:main
          fi
