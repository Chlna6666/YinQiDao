name: Remove legacy lyric offsets once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-legacy-lyric-offsets-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Remove obsolete lyric animation state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/ui/shell.rs')
          text = path.read_text(encoding='utf-8')

          patterns = [
              (r'(?m)^\s*pub\(crate\) lyrics_current_offset: f32,\n\s*pub\(crate\) lyrics_target_offset: f32,\n', '', 'field declarations'),
              (r'(?m)^\s*lyrics_current_offset: 0\.0,\n\s*lyrics_target_offset: 0\.0,\n', '', 'initializers'),
              (r'\n\s*\|\| \(self\.stage_open\s*\n\s*&& \(self\.lyrics_target_offset - self\.lyrics_current_offset\)\.abs\(\) > 0\.5\)', '', 'active animation predicate'),
              (r'(?m)^\s*self\.lyrics_current_offset = 0\.0;\n\s*self\.lyrics_target_offset = 0\.0;\n', '', 'track change reset'),
              (r'(?m)^\s*self\.lyrics_target_offset = \(current_idx as f32\) \* 60\.0;\n', '', 'active lyric target write'),
              (
                  r'''\n\s*if self\.stage_open \{\n\s*let in_user_scroll = self\n\s*\.lyrics_user_scrolling_until\n\s*\.is_some_and\(\|until\| std::time::Instant::now\(\) < until\);\n\s*if !in_user_scroll \{\n\s*let diff = self\.lyrics_target_offset - self\.lyrics_current_offset;\n\s*if diff\.abs\(\) > 0\.5 \{\n\s*let factor = 1\.0 - \(-9\.0 \* dt\)\.exp\(\);\n\s*self\.lyrics_current_offset \+= diff \* factor;\n\s*\} else \{\n\s*self\.lyrics_current_offset = self\.lyrics_target_offset;\n\s*\}\n\s*\}\n\s*\}\n''',
                  '\n',
                  'render smoothing block',
              ),
              (
                  r'''\n\s*#\[test\]\n\s*fn test_lyrics_target_offset_centering\(\) \{\n\s*let target_0 = 0_f32 \* 60\.0;\n\s*assert_eq!\(target_0, 0\.0\);\n\s*let target_10 = 10_f32 \* 60\.0;\n\s*assert_eq!\(target_10, 600\.0\);\n\s*\}\n''',
                  '\n',
                  'obsolete offset test',
              ),
          ]

          for pattern, replacement, label in patterns:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')

          path.write_text(text, encoding='utf-8')
          PY

          if grep -R -n -E 'lyrics_(current|target)_offset' src; then
            echo 'obsolete lyric offset state still referenced' >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/shell.rs
          git commit -m 'perf(player): 移除失效的歌词逐帧动画状态'
          git push origin HEAD:main
