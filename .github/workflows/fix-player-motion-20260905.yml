name: Apply player motion fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-player-motion-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(ci): 应用播放器流体与歌词动画修复'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch player motion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          player = 'src/ui/player_stage.rs'
          shell = 'src/ui/shell.rs'

          replace_once(
              player,
              '''use gpui::{
    Animation, AnimationDirection, AnimationExt as _, AnimationProperty, AnimationSpec,
    CompositeLayerExt as _, Context, Easing,
    EncodedImageBytes, ImageFormat, IntoElement, ObjectFit, RepeatMode, SharedString,
    StatefulInteractiveElement as _, div, hsla, img, linear_color_stop, linear_gradient,
    point, prelude::*, px, relative, rgb,
};''',
              '''use gpui::{
    Animation, AnimationDirection, AnimationExt as _, AnimationProperty, AnimationSpec,
    CompositeLayerExt as _, Context, Easing,
    EncodedImageBytes, ImageFormat, IntoElement, ObjectFit, RepeatMode, SharedString,
    StatefulInteractiveElement as _, Transition, TransitionProperty, div, hsla, img,
    linear_color_stop, linear_gradient, point, prelude::*, px, radians, relative, rgb,
};''',
          )

          replace_once(
              player,
              '''                this.lyrics_user_scrolling_until =
                    Some(Instant::now() + Duration::from_secs(3));
                this.wake_stage_controls(cx);''',
              '''                this.lyrics_user_scrolling_until =
                    Some(Instant::now() + Duration::from_secs(3));
                this.lyrics_scroll_target_y = None;
                this.wake_stage_controls(cx);''',
          )

          replace_once(
              player,
              '''        let distance = index.abs_diff(active) as f32;
        let focus = (-1.05 * distance).exp().clamp(0.0, 1.0);
        let alpha = 0.16 + focus * 0.84;
        let size = 18.0 + focus * 12.0;
        let timestamp = line.timestamp_ms;''',
              '''        let distance = index.abs_diff(active) as f32;
        let focus = (-1.05 * distance).exp().clamp(0.0, 1.0);
        let alpha = 0.18 + focus * 0.82;
        let scale = 0.90 + focus * 0.10;
        let timestamp = line.timestamp_ms;''',
          )

          replace_once(
              player,
              '''                    .text_size(px(size))
                    .text_color(hsla(0.0, 0.0, 1.0, alpha))''',
              '''                    .text_size(px(24.0))
                    .text_color(hsla(0.0, 0.0, 1.0, 1.0))''',
          )

          replace_once(
              player,
              '''                    .text_size(px((size * 0.66).max(13.0)))
                    .text_color(hsla(0.0, 0.0, 1.0, alpha * 0.68))''',
              '''                    .text_size(px(15.5))
                    .text_color(hsla(0.0, 0.0, 1.0, 0.68))''',
          )

          replace_once(
              player,
              '''                .py(px(9.0))
                .mb(px(8.0))
                .opacity(if index == active { 1.0 } else { 0.96 })
                .cursor_pointer()''',
              '''                .py(px(9.0))
                .mb(px(8.0))
                .scale(scale)
                .opacity(alpha)
                .transition(lyric_focus_transition())
                .cursor_pointer()''',
          )

          replace_once(
              player,
              '''                        this.seek_to_ms(timestamp, cx);
                        this.lyrics_user_scrolling_until = None;
                        this.lyrics_scroll_handle
                            .scroll_to_top_of_item(index.saturating_sub(2));
                        this.wake_stage_controls_immediately(cx);''',
              '''                        this.seek_to_ms(timestamp, cx);
                        this.lyrics_user_scrolling_until = None;
                        this.last_lyric_index = Some(index);
                        this.lyrics_scroll_target_y =
                            Some(f32::from(this.lyrics_scroll_handle.offset().y));
                        this.wake_stage_controls_immediately(cx);''',
          )

          replace_once(
              player,
              '''    viewport.into_any_element()
}

fn stage_controls(''',
              '''    viewport.into_any_element()
}

fn lyric_focus_transition() -> Transition {
    Transition::new(Duration::from_millis(360))
        .ease(Easing::OutCubic)
        .properties([TransitionProperty::Opacity, TransitionProperty::Transform])
}

fn stage_controls(''',
          )

          replace_once(
              player,
              '''    // Move the cached blur surface itself. Rotation around a large nearly symmetric blur can be
    // technically active yet visually imperceptible; a bounded compositor translation produces an
    // immediately visible Apple Music-style drift without relayout or re-running the Gaussian blur.
    let spec = AnimationSpec::new(Duration::from_secs(period_seconds))
        .repeat(RepeatMode::Forever)
        .direction(AnimationDirection::Alternate)
        .ease(Easing::Linear);
    let dx = drift_x * direction;
    let translation = Animation::from_spec(spec).with_property(
        AnimationProperty::translation(
            point(px(-dx), px(-drift_y)),
            point(px(dx), px(drift_y)),
        ),
    );

    orbit
        .with_animation(animation_id, translation, |element, _| element)
        .into_any_element()''',
              '''    // The blur surface stays cached. Rotating an off-centre blob inside a non-square orbit
    // generates a true elliptical path, while the outer translation adds a slower independent drift.
    // Both are renderer-owned visual properties, so no layout or Gaussian blur work runs per frame.
    let rotation = Animation::from_spec(
        AnimationSpec::new(Duration::from_secs(period_seconds))
            .repeat(RepeatMode::Forever)
            .ease(Easing::Linear),
    )
    .with_property(AnimationProperty::rotation(
        radians(0.0),
        radians(std::f32::consts::TAU * direction),
    ));
    let orbit = orbit.with_animation(
        SharedString::from(format!("{animation_id}-rotation")),
        rotation,
        |element, _| element,
    );

    let drift_spec = AnimationSpec::new(Duration::from_secs(period_seconds + 4))
        .repeat(RepeatMode::Forever)
        .direction(AnimationDirection::Alternate)
        .ease(Easing::Linear);
    let dx = drift_x * direction;
    let translation = Animation::from_spec(drift_spec).with_property(
        AnimationProperty::translation(
            point(px(-dx), px(-drift_y)),
            point(px(dx), px(drift_y)),
        ),
    );

    orbit
        .with_animation(animation_id, translation, |element, _| element)
        .into_any_element()''',
          )

          replace_once(
              shell,
              '''    pub(crate) stage_suppress_wake_until: Option<std::time::Instant>,
    pub(crate) lyrics_user_scrolling_until: Option<std::time::Instant>,
    pub(crate) library_scroll_handle: gpui::UniformListScrollHandle,''',
              '''    pub(crate) stage_suppress_wake_until: Option<std::time::Instant>,
    pub(crate) lyrics_user_scrolling_until: Option<std::time::Instant>,
    pub(crate) lyrics_scroll_target_y: Option<f32>,
    pub(crate) library_scroll_handle: gpui::UniformListScrollHandle,''',
          )

          replace_once(
              shell,
              '''            stage_suppress_wake_until: None,
            lyrics_user_scrolling_until: None,
            library_scroll_handle: gpui::UniformListScrollHandle::new(),''',
              '''            stage_suppress_wake_until: None,
            lyrics_user_scrolling_until: None,
            lyrics_scroll_target_y: None,
            library_scroll_handle: gpui::UniformListScrollHandle::new(),''',
          )

          replace_once(
              shell,
              '''    pub(crate) fn has_active_animations(&self) -> bool {
        self.stage_animating
            || (self.stage_open
                && (self.stage_controls_visibility > 0.005
                    && self.stage_controls_visibility < 0.995))
    }''',
              '''    fn advance_lyrics_scroll_animation(&mut self, dt: f32) {
        if !self.stage_open {
            self.lyrics_scroll_target_y = None;
            return;
        }
        if self
            .lyrics_user_scrolling_until
            .is_some_and(|until| std::time::Instant::now() < until)
        {
            self.lyrics_scroll_target_y = None;
            return;
        }
        let Some(index) = self.last_lyric_index else {
            self.lyrics_scroll_target_y = None;
            return;
        };
        let viewport = self.lyrics_scroll_handle.bounds();
        let Some(line) = self.lyrics_scroll_handle.bounds_for_item(index) else {
            self.lyrics_scroll_target_y = Some(f32::from(self.lyrics_scroll_handle.offset().y));
            return;
        };
        let max_offset = f32::from(self.lyrics_scroll_handle.max_offset().height).max(0.0);
        let target = f32::from(viewport.center().y - line.center().y).clamp(-max_offset, 0.0);
        self.lyrics_scroll_target_y = Some(target);

        let offset = self.lyrics_scroll_handle.offset();
        let current = f32::from(offset.y);
        let diff = target - current;
        if diff.abs() <= 0.35 {
            self.lyrics_scroll_handle
                .set_offset(gpui::Point::new(offset.x, gpui::px(target)));
            return;
        }

        let factor = 1.0 - (-13.5 * dt).exp();
        let next = current + diff * factor;
        self.lyrics_scroll_handle
            .set_offset(gpui::Point::new(offset.x, gpui::px(next)));
    }

    pub(crate) fn has_active_animations(&self) -> bool {
        let lyrics_scrolling = self.stage_open
            && self.lyrics_scroll_target_y.is_some_and(|target| {
                (target - f32::from(self.lyrics_scroll_handle.offset().y)).abs() > 0.35
            });
        self.stage_animating
            || (self.stage_open
                && (self.stage_controls_visibility > 0.005
                    && self.stage_controls_visibility < 0.995))
            || lyrics_scrolling
    }''',
          )

          replace_once(
              shell,
              '''                self.last_polled_track_id = curr_track_id;
                self.last_lyric_index = None;
                self.lyrics_user_scrolling_until = None;
                self.lyrics_scroll_handle.scroll_to_item(0);''',
              '''                self.last_polled_track_id = curr_track_id;
                self.last_lyric_index = None;
                self.lyrics_user_scrolling_until = None;
                self.lyrics_scroll_target_y = None;
                self.lyrics_scroll_handle.scroll_to_item(0);''',
          )

          replace_once(
              shell,
              '''                        if !in_user_scroll {
                            self.lyrics_scroll_handle
                                .scroll_to_top_of_item(current_idx.saturating_sub(2));
                        }''',
              '''                        if !in_user_scroll {
                            self.lyrics_scroll_target_y =
                                Some(f32::from(self.lyrics_scroll_handle.offset().y));
                        }''',
          )

          replace_once(
              shell,
              '''        } else {
            self.stage_controls_visibility = target_visibility;
        }

        if self.has_active_animations() {''',
              '''        } else {
            self.stage_controls_visibility = target_visibility;
        }

        self.advance_lyrics_scroll_animation(dt);

        if self.has_active_animations() {''',
          )
          PY

          cargo fmt
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-player-motion-20260905.yml
          git add src/ui/player_stage.rs src/ui/shell.rs .github/workflows/fix-player-motion-20260905.yml
          git commit -m "fix(player): 恢复歌词动效并增强流体背景"
          git push origin HEAD:main
