name: Apply Apple Music fluid field fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-apple-fluid-field-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply already validated patch
        shell: bash
        run: python .github/scripts/apply_apple_fluid_field_20260905.py

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/scripts/apply_apple_fluid_field_20260905.py
          rm .github/workflows/apply-apple-fluid-field-20260905.yml
          git config user.name "Chlna6666"
          git config user.email "79357769+Chlna6666@users.noreply.github.com"
          git add src/ui/player_stage.rs .github/scripts/apply_apple_fluid_field_20260905.py .github/workflows/apply-apple-fluid-field-20260905.yml
          git commit -m "fix(player): 重构 Apple Music 流体背景"
          git push origin HEAD:main
