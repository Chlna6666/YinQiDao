name: Apply Apple Music player motion fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-apple-music-motion-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply Apple-style motion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          player = Path('src/ui/player_stage.rs')
          shell = Path('src/ui/shell.rs')

          # The style transition was watching Transform while the style actually changes Scale.
          replace_once(
              str(player),
              '''fn lyric_focus_transition() -> Transition {
    Transition::new(Duration::from_millis(360))
        .ease(Easing::OutCubic)
        .properties([TransitionProperty::Opacity, TransitionProperty::Transform])
}''',
              '''fn lyric_focus_transition() -> Transition {
    Transition::new(Duration::from_millis(420))
        .ease(Easing::OutCubic)
        .properties([TransitionProperty::Opacity, TransitionProperty::Scale])
}''',
          )

          # Give every lyric change a new scene-animation identity so seeking back to a previous
          # line replays the entry motion rather than reusing a completed retained timeline.
          replace_once(
              str(shell),
              '''    pub(crate) lyrics_scroll_handle: gpui::ScrollHandle,
    pub(crate) last_lyric_index: Option<usize>,
    pub(crate) stage_open: bool,''',
              '''    pub(crate) lyrics_scroll_handle: gpui::ScrollHandle,
    pub(crate) last_lyric_index: Option<usize>,
    pub(crate) lyric_motion_epoch: u64,
    pub(crate) stage_open: bool,''',
          )
          replace_once(
              str(shell),
              '''            lyrics_scroll_handle: gpui::ScrollHandle::new(),
            last_lyric_index: None,
            stage_open: false,''',
              '''            lyrics_scroll_handle: gpui::ScrollHandle::new(),
            last_lyric_index: None,
            lyric_motion_epoch: 0,
            stage_open: false,''',
          )
          replace_once(
              str(shell),
              '''        self.last_lyric_index = None;
        self.lyrics_scroll_handle.scroll_to_item(0);
        cx.notify();''',
              '''        self.last_lyric_index = None;
        self.lyric_motion_epoch = self.lyric_motion_epoch.wrapping_add(1);
        self.lyrics_scroll_handle.scroll_to_item(0);
        cx.notify();''',
          )
          replace_once(
              str(shell),
              '''                self.last_lyric_index = None;
                self.lyrics_user_scrolling_until = None;
                self.lyrics_scroll_target_y = None;
                self.lyrics_scroll_handle.scroll_to_item(0);''',
              '''                self.last_lyric_index = None;
                self.lyric_motion_epoch = self.lyric_motion_epoch.wrapping_add(1);
                self.lyrics_user_scrolling_until = None;
                self.lyrics_scroll_target_y = None;
                self.lyrics_scroll_handle.scroll_to_item(0);''',
          )
          replace_once(
              str(shell),
              '''                    if self.last_lyric_index != Some(current_idx) {
                        self.last_lyric_index = Some(current_idx);
                        let in_user_scroll = self''',
              '''                    if self.last_lyric_index != Some(current_idx) {
                        self.last_lyric_index = Some(current_idx);
                        self.lyric_motion_epoch = self.lyric_motion_epoch.wrapping_add(1);
                        let in_user_scroll = self''',
          )

          # Anchor the active line slightly above center, matching the Apple Music lyric composition.
          old_scroll = '''        let max_offset = f32::from(self.lyrics_scroll_handle.max_offset().height).max(0.0);
        let target = f32::from(viewport.center().y - line.center().y).clamp(-max_offset, 0.0);
        self.lyrics_scroll_target_y = Some(target);

        let offset = self.lyrics_scroll_handle.offset();
        let current = f32::from(offset.y);
        let diff = target - current;
        if diff.abs() <= 0.35 {
            self.lyrics_scroll_handle
                .set_offset(gpui::Point::new(offset.x, gpui::px(target)));
            return;
        }

        let factor = 1.0 - (-13.5 * dt).exp();
        let next = current + diff * factor;'''
          new_scroll = '''        let max_offset = f32::from(self.lyrics_scroll_handle.max_offset().height).max(0.0);
        let anchor_y = f32::from(viewport.origin.y) + f32::from(viewport.size.height) * 0.43;
        let target = (anchor_y - f32::from(line.center().y)).clamp(-max_offset, 0.0);
        self.lyrics_scroll_target_y = Some(target);

        let offset = self.lyrics_scroll_handle.offset();
        let current = f32::from(offset.y);
        let diff = target - current;
        if diff.abs() <= 0.30 {
            self.lyrics_scroll_handle
                .set_offset(gpui::Point::new(offset.x, gpui::px(target)));
            return;
        }

        // Apple Music reads as a soft camera settle, not a constant-speed list scroll.
        let factor = 1.0 - (-9.5 * dt).exp();
        let next = current + diff * factor;'''
          replace_once(str(shell), old_scroll, new_scroll)
          replace_once(
              str(shell),
              '''                (target - f32::from(self.lyrics_scroll_handle.offset().y)).abs() > 0.35''',
              '''                (target - f32::from(self.lyrics_scroll_handle.offset().y)).abs() > 0.30''',
          )

          text = player.read_text(encoding='utf-8')
          loop_start = text.index('    for (index, line) in lyrics.iter().enumerate() {')
          loop_end = text.index('\n    viewport.into_any_element()', loop_start)
          new_loop = r'''    for (index, line) in lyrics.iter().enumerate() {
        let distance = index.abs_diff(active);
        let alpha = match distance {
            0 => 1.0,
            1 => 0.48,
            2 => 0.28,
            _ => 0.18,
        };
        let scale = match distance {
            0 => 1.0,
            1 => 0.955,
            _ => 0.925,
        };
        let timestamp = line.timestamp_ms;
        let weight = if index == active {
            gpui::FontWeight::BOLD
        } else if distance == 1 {
            gpui::FontWeight::SEMIBOLD
        } else {
            gpui::FontWeight::MEDIUM
        };

        let mut text = div()
            .w_full()
            .min_w(px(0.0))
            .flex()
            .flex_col()
            .gap_1()
            .font_weight(weight)
            .child(
                div()
                    .w_full()
                    .min_w(px(0.0))
                    .text_size(px(28.0))
                    .text_color(hsla(0.0, 0.0, 1.0, 1.0))
                    .child(line.text.clone()),
            );

        if let Some(translation) = line
            .translation
            .as_deref()
            .filter(|translation| !translation.trim().is_empty())
        {
            text = text.child(
                div()
                    .w_full()
                    .min_w(px(0.0))
                    .text_size(px(17.0))
                    .text_color(hsla(0.0, 0.0, 1.0, 0.72))
                    .child(translation.to_owned()),
            );
        }

        let line_element = div()
            .id(SharedString::from(format!("lyric-line-{index}")))
            .w_full()
            .min_w(px(0.0))
            .flex_none()
            .pl(px(16.0))
            .pr(px(12.0))
            .py(px(11.0))
            .mb(px(10.0))
            .scale(scale)
            .opacity(alpha)
            .transition(lyric_focus_transition())
            .cursor_pointer()
            .hover(|style| style.opacity(1.0))
            .child(text)
            .on_mouse_down(
                gpui::MouseButton::Left,
                cx.listener(move |this, _, _, cx| {
                    cx.stop_propagation();
                    this.seek_to_ms(timestamp, cx);
                    this.lyrics_user_scrolling_until = None;
                    if this.last_lyric_index != Some(index) {
                        this.last_lyric_index = Some(index);
                        this.lyric_motion_epoch = this.lyric_motion_epoch.wrapping_add(1);
                    }
                    this.lyrics_scroll_target_y =
                        Some(f32::from(this.lyrics_scroll_handle.offset().y));
                    this.wake_stage_controls_immediately(cx);
                }),
            );

        let line_element = if index == active {
            let enter = Animation::from_spec(
                AnimationSpec::new(Duration::from_millis(440)).ease(Easing::OutCubic),
            )
            .with_property(AnimationProperty::translation(
                point(px(0.0), px(20.0)),
                point(px(0.0), px(0.0)),
            ));
            line_element
                .with_animation(
                    SharedString::from(format!(
                        "lyric-enter-{}-{index}",
                        app.lyric_motion_epoch
                    )),
                    enter,
                    |element, _| element,
                )
                .into_any_element()
        } else {
            line_element.into_any_element()
        };

        viewport = viewport.child(line_element);
    }
'''
          player.write_text(text[:loop_start] + new_loop + text[loop_end:], encoding='utf-8')

          # Replace the old rotating blur discs with cover-derived moving color fields. Rotating a
          # near-circular Gaussian is mathematically active but visually close to invariant.
          text = player.read_text(encoding='utf-8')
          ambient_start = text.index('fn ambient_background(')
          ambient_end = text.index('fn ambient_palette(', ambient_start)
          new_ambient = r'''fn ambient_background(
    id: Option<i64>,
    artwork: Option<Arc<[u8]>>,
    blurred: Option<Arc<[u8]>>,
    palette: Option<&ArtworkPalette>,
    dynamic: bool,
    blur_radius: f32,
) -> impl IntoElement {
    let id = id.unwrap_or_default();
    let (c1, c2, c3, dark, mask) = ambient_palette(id, palette);
    let sigma = (blur_radius * 0.52).clamp(6.0, 30.0);
    let mut root = div().absolute().inset_0().overflow_hidden().bg(dark);

    // Apple Music's field is recognisably derived from the cover, not just three generic circles.
    // Two oversized copies carry the cover's spatial colour structure at independent periods.
    if let Some(bytes) = blurred.or(artwork) {
        root = root
            .child(artwork_motion_layer(
                "stage-fluid-artwork-primary",
                bytes.clone(),
                1.34,
                0.44,
                145.0,
                86.0,
                17,
                false,
                dynamic,
            ))
            .child(artwork_motion_layer(
                "stage-fluid-artwork-secondary",
                bytes,
                1.72,
                0.20,
                220.0,
                132.0,
                27,
                true,
                dynamic,
            ));
    }

    root
        .child(orbit_blob(
            "stage-fluid-a-orbit",
            -0.22,
            -0.25,
            0.88,
            0.94,
            0.04,
            0.08,
            0.78,
            0.72,
            24.0,
            c1,
            0.58,
            sigma,
            13,
            1.0,
            185.0,
            118.0,
            dynamic,
        ))
        .child(orbit_blob(
            "stage-fluid-b-orbit",
            0.34,
            -0.18,
            0.82,
            0.88,
            0.10,
            0.08,
            0.76,
            0.74,
            208.0,
            c2,
            0.54,
            sigma * 0.94,
            17,
            -1.0,
            168.0,
            146.0,
            dynamic,
        ))
        .child(orbit_blob(
            "stage-fluid-c-orbit",
            -0.02,
            0.34,
            0.94,
            0.82,
            0.08,
            0.04,
            0.82,
            0.76,
            301.0,
            c3,
            0.50,
            sigma * 1.08,
            21,
            1.0,
            205.0,
            108.0,
            dynamic,
        ))
        .child(
            div()
                .absolute()
                .inset_0()
                .bg(linear_gradient(
                    180.0,
                    linear_color_stop(
                        hsla(0.0, 0.0, 0.01, (mask * 0.30).clamp(0.10, 0.28)),
                        0.0,
                    ),
                    linear_color_stop(
                        hsla(0.0, 0.0, 0.004, (mask * 0.56).clamp(0.22, 0.46)),
                        1.0,
                    ),
                )),
        )
}

#[allow(clippy::too_many_arguments)]
fn artwork_motion_layer(
    animation_id: &'static str,
    bytes: Arc<[u8]>,
    scale: f32,
    opacity: f32,
    drift_x: f32,
    drift_y: f32,
    period_seconds: u64,
    reverse: bool,
    animate: bool,
) -> gpui::AnyElement {
    let layer = div()
        .absolute()
        .inset_0()
        .scale(scale)
        .opacity(opacity)
        .child(
            img(EncodedImageBytes::new(ImageFormat::Png, bytes))
                .size_full()
                .object_fit(ObjectFit::Cover),
        )
        .composite_layer();

    if !animate {
        return layer.into_any_element();
    }

    let x_direction = if reverse {
        AnimationDirection::AlternateReverse
    } else {
        AnimationDirection::Alternate
    };
    let y_direction = if reverse {
        AnimationDirection::Alternate
    } else {
        AnimationDirection::AlternateReverse
    };
    let x_motion = Animation::from_spec(
        AnimationSpec::new(Duration::from_secs(period_seconds))
            .repeat(RepeatMode::Forever)
            .direction(x_direction)
            .ease(Easing::Linear),
    )
    .with_property(AnimationProperty::translation(
        point(px(-drift_x), px(0.0)),
        point(px(drift_x), px(0.0)),
    ));
    let layer = layer.with_animation(
        SharedString::from(format!("{animation_id}-x")),
        x_motion,
        |element, _| element,
    );

    let y_motion = Animation::from_spec(
        AnimationSpec::new(Duration::from_secs(period_seconds + 7))
            .repeat(RepeatMode::Forever)
            .direction(y_direction)
            .ease(Easing::Linear),
    )
    .with_property(AnimationProperty::translation(
        point(px(0.0), px(-drift_y)),
        point(px(0.0), px(drift_y)),
    ));

    layer
        .with_animation(
            SharedString::from(format!("{animation_id}-y")),
            y_motion,
            |element, _| element,
        )
        .into_any_element()
}

#[allow(clippy::too_many_arguments)]
fn orbit_blob(
    animation_id: &'static str,
    left: f32,
    top: f32,
    width: f32,
    height: f32,
    blob_left: f32,
    blob_top: f32,
    blob_width: f32,
    blob_height: f32,
    angle: f32,
    color: gpui::Hsla,
    alpha: f32,
    sigma: f32,
    period_seconds: u64,
    direction: f32,
    drift_x: f32,
    drift_y: f32,
    animate: bool,
) -> gpui::AnyElement {
    let blob = div()
        .absolute()
        .left(relative(blob_left))
        .top(relative(blob_top))
        .w(relative(blob_width))
        .h(relative(blob_height))
        .rounded_full()
        .blur(px(sigma))
        .bg(linear_gradient(
            angle,
            linear_color_stop(color.opacity(alpha), 0.0),
            linear_color_stop(color.opacity(0.0), 1.0),
        ));

    let orbit = div()
        .absolute()
        .left(relative(left))
        .top(relative(top))
        .w(relative(width))
        .h(relative(height))
        .child(blob)
        .composite_layer();

    if !animate {
        return orbit.into_any_element();
    }

    let x_direction = if direction >= 0.0 {
        AnimationDirection::Alternate
    } else {
        AnimationDirection::AlternateReverse
    };
    let y_direction = if direction >= 0.0 {
        AnimationDirection::AlternateReverse
    } else {
        AnimationDirection::Alternate
    };
    let x_motion = Animation::from_spec(
        AnimationSpec::new(Duration::from_secs(period_seconds))
            .repeat(RepeatMode::Forever)
            .direction(x_direction)
            .ease(Easing::Linear),
    )
    .with_property(AnimationProperty::translation(
        point(px(-drift_x), px(0.0)),
        point(px(drift_x), px(0.0)),
    ));
    let orbit = orbit.with_animation(
        SharedString::from(format!("{animation_id}-x")),
        x_motion,
        |element, _| element,
    );

    let y_motion = Animation::from_spec(
        AnimationSpec::new(Duration::from_secs(period_seconds + 6))
            .repeat(RepeatMode::Forever)
            .direction(y_direction)
            .ease(Easing::Linear),
    )
    .with_property(AnimationProperty::translation(
        point(px(0.0), px(-drift_y)),
        point(px(0.0), px(drift_y)),
    ));

    orbit
        .with_animation(
            SharedString::from(format!("{animation_id}-y")),
            y_motion,
            |element, _| element,
        )
        .into_any_element()
}

'''
          player.write_text(text[:ambient_start] + new_ambient + text[ambient_end:], encoding='utf-8')

          # Rotation is no longer used; the Apple-style field is built from compound translations.
          replace_once(
              str(player),
              '    point, prelude::*, px, radians, relative, rgb,',
              '    point, prelude::*, px, relative, rgb,',
          )
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chlna6666@users.noreply.github.com"
          rm -f .github/workflows/apply-apple-music-motion-20260905.yml
          git add -A
          git commit -m "fix(player): 重构 Apple Music 歌词与流体动效"
          git push origin HEAD:main
