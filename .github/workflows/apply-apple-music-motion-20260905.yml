name: Apply Apple Music player motion fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-apple-music-motion-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply patch
        shell: bash
        run: python .github/scripts/apply_apple_music_motion_20260905.py

      - name: Format
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Check
        shell: bash
        run: cargo check --locked

      - name: Clippy
        shell: bash
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chlna6666@users.noreply.github.com"
          rm -f .github/workflows/apply-apple-music-motion-20260905.yml
          rm -f .github/scripts/apply_apple_music_motion_20260905.py
          git add -A
          git commit -m "fix(player): 重构 Apple Music 歌词与流体动效"
          git push origin HEAD:main
