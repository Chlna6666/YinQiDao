name: Finalize real player source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Fix exact shell lints
        shell: pwsh
        run: |
          $path = 'src/ui/shell.rs'
          $text = [IO.File]::ReadAllText($path)
          $old1 = 'let _ = fluid_background.update(cx, |view, cx| {'
          $new1 = 'fluid_background.update(cx, |view, cx| {'
          if (($text.Split($old1).Count - 1) -ne 1) { throw 'fluid update anchor mismatch' }
          $text = $text.Replace($old1, $new1)
          $old2 = 'rgb(0x0e_0f_16)'
          $new2 = 'rgb(0x0e0f16)'
          if (($text.Split($old2).Count - 1) -ne 1) { throw 'rgb literal anchor mismatch' }
          $text = $text.Replace($old2, $new2)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "Chlna6666"
          git config user.email "79357769+Chlna6666@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/validate-real-player-fix-20260905.yml \
            .github/workflows/finalize-real-player-source-20260905.yml
          git add src/ui/shell.rs src/ui/components/slider.rs
          git diff --cached --stat
          git commit -m "fix(player): 完成沉浸交互源码验证修正"
          git push origin HEAD:main
