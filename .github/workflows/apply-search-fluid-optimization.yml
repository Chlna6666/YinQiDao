name: Apply search and fluid optimization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-search-fluid-optimization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply search and fluid fixes
        shell: python
        run: |
          from pathlib import Path

          shell_path = Path("src/ui/shell.rs")
          shell = shell_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source block, found {count}")
              return text.replace(old, new, 1)

          shell = replace_once(
              shell,
              "    content_revision: u64,\n    query_revision: u64,\n    status_fingerprint: u64,",
              "    content_revision: u64,\n    status_fingerprint: u64,\n    search_fingerprint: u64,",
              "library render-key fields",
          )
          shell = replace_once(
              shell,
              "        content_revision: app.ui_content_revision,\n        query_revision: app.library_refresh_request,\n        status_fingerprint: text_fingerprint(&app.status),",
              "        content_revision: app.ui_content_revision,\n        status_fingerprint: text_fingerprint(&app.status),\n        search_fingerprint: text_fingerprint(&app.search),",
              "library render-key values",
          )

          update_start = shell.index("    pub(crate) fn update_search(")
          update_end = shell.index("    fn apply_scan(", update_start)
          update_search = '''    pub(crate) fn update_search(&mut self, key: &str, cx: &mut Context<Self>) {
              if key == "backspace" {
                  self.search.pop();
              } else if key.len() == 1 && !key.chars().next().is_some_and(char::is_control) {
                  self.search.push_str(key);
              }
              // `library::render` already filters the authoritative in-memory track set. Avoid a
              // SQLite query and audio-registry replacement for every search keystroke.
              cx.notify();
          }

          '''
          update_search = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in update_search.splitlines()
          ) + "\n"
          shell = shell[:update_start] + update_search + shell[update_end:]

          shell = replace_once(
              shell,
              "        let request = self.library_refresh_request;\n        let search = self.search.clone();\n        let task = Tokio::spawn_result(cx, async move {",
              "        let request = self.library_refresh_request;\n        let task = Tokio::spawn_result(cx, async move {",
              "refresh search capture",
          )
          shell = replace_once(
              shell,
              "            let tracks =\n                tokio::task::spawn_blocking(move || library.tracks(Some(&search))).await??;",
              "            let tracks = tokio::task::spawn_blocking(move || library.tracks(None)).await??;",
              "authoritative library refresh",
          )

          shell = replace_once(
              shell,
              "        let status_key = library_page_render_key(&app);\n        app.status.push_str(\" · updated\");\n        assert_ne!(status_key, library_page_render_key(&app));\n    }",
              "        let status_key = library_page_render_key(&app);\n        app.status.push_str(\" · updated\");\n        assert_ne!(status_key, library_page_render_key(&app));\n\n        let search_key = library_page_render_key(&app);\n        app.search.push_str(\"ambient\");\n        assert_ne!(search_key, library_page_render_key(&app));\n    }",
              "render-key search test",
          )

          if "library.tracks(Some(&search))" in shell:
              raise SystemExit("filtered DB refresh still present")
          if "query_revision:" in shell:
              raise SystemExit("obsolete query revision still present in render key")
          shell_path.write_text(shell, encoding="utf-8")

          stage_path = Path("src/ui/player_stage.rs")
          stage = stage_path.read_text(encoding="utf-8")
          stage = replace_once(
              stage,
              ".ease(Easing::InOutCubic);",
              ".ease(Easing::Linear);",
              "fluid easing",
          )
          stage = replace_once(
              stage,
              "    // coprime, keeping a long composite repeat period without a CPU animation loop.\n    let spec = AnimationSpec::new(Duration::from_secs(period_seconds))",
              "    // coprime, keeping a long composite repeat period without a CPU animation loop.\n    // Linear easing keeps angular velocity constant across revolution boundaries.\n    let spec = AnimationSpec::new(Duration::from_secs(period_seconds))",
              "fluid easing comment",
          )
          stage_path.write_text(stage, encoding="utf-8")

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add src/ui/shell.rs
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'no library search optimization generated' >&2
            exit 1
          }
          git commit -m 'perf(library): 移除搜索输入的重复数据库刷新'

          git add src/ui/player_stage.rs
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'no player fluid fix generated' >&2
            exit 1
          }
          git commit -m 'fix(player): 让流体轨道保持连续旋转'

          git push origin HEAD:main
