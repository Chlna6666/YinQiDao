name: Temporary Cargo.lock reconciliation
on:
  push:
    paths:
      - .github/workflows/temporary-lockfile-resolve.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve lockfile with Cargo
        run: cargo metadata --format-version 1 > /dev/null
      - name: Emit resolved lockfile for review
        run: |
          echo 'YINQIDAO_LOCK_BEGIN_7CE159'
          cat Cargo.lock
          echo 'YINQIDAO_LOCK_END_7CE159'
