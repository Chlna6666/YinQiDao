name: Apply GPU shader effect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-gpu-shader-effect-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply source patch
        shell: bash
        run: python .github/scripts/apply_gpu_shader_effect_20260905.py

      - name: Format
        shell: bash
        run: cargo fmt --all -- --check

      - name: Check
        shell: bash
        run: cargo check --locked

      - name: Clippy
        shell: bash
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate Apple fluid WGSL
        shell: bash
        run: cargo test --locked apple_fluid_shader_validates -- --nocapture

      - name: Commit validated implementation
        shell: bash
        run: |
          rm .github/scripts/apply_gpu_shader_effect_20260905.py
          rm .github/workflows/apply-gpu-shader-effect-20260905.yml
          git config user.name "Chlna6666"
          git config user.email "79357769+Chlna6666@users.noreply.github.com"
          git add src/main.rs src/gpu src/ui/player_stage.rs .github/scripts/apply_gpu_shader_effect_20260905.py .github/workflows/apply-gpu-shader-effect-20260905.yml
          git commit -m "feat(gpu): 新增通用着色器效果层并重构流体背景"
          git push origin HEAD:main
