name: Recover player motion fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-player-motion-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stored patch and validate
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/fix-player-motion-20260905.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<player-motion-patch>', 'exec'))
          PY

          cargo fmt
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-player-motion-20260905.yml
          rm .github/workflows/recover-player-motion-20260905.yml
          git add src/ui/player_stage.rs src/ui/shell.rs .github/workflows/fix-player-motion-20260905.yml .github/workflows/recover-player-motion-20260905.yml
          git commit -m "fix(player): 恢复歌词动效并增强流体背景"
          git push origin HEAD:main
