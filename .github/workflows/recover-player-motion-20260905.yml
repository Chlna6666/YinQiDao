name: Recover player motion fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-player-motion-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply player motion patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {old[:80]!r}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          player = "src/ui/player_stage.rs"
          shell = "src/ui/shell.rs"

          replace_once(player, "EncodedImageBytes, ImageFormat, IntoElement, ObjectFit, RepeatMode, SharedString,", "EncodedImageBytes, ImageFormat, IntoElement, ObjectFit, RepeatMode, SharedString, Transition,\n    TransitionProperty,")
          replace_once(player, "point, prelude::*, px, relative, rgb,", "point, prelude::*, px, radians, relative, rgb,")

          replace_once(player, "                this.lyrics_user_scrolling_until =\n                    Some(Instant::now() + Duration::from_secs(3));\n                this.wake_stage_controls(cx);", "                this.lyrics_user_scrolling_until =\n                    Some(Instant::now() + Duration::from_secs(3));\n                this.lyrics_scroll_target_y = None;\n                this.wake_stage_controls(cx);")

          replace_once(player, "        let alpha = 0.16 + focus * 0.84;\n        let size = 18.0 + focus * 12.0;", "        let alpha = 0.18 + focus * 0.82;\n        let scale = 0.90 + focus * 0.10;")
          replace_once(player, ".text_size(px(size))\n                    .text_color(hsla(0.0, 0.0, 1.0, alpha))", ".text_size(px(24.0))\n                    .text_color(hsla(0.0, 0.0, 1.0, 1.0))")
          replace_once(player, ".text_size(px((size * 0.66).max(13.0)))\n                    .text_color(hsla(0.0, 0.0, 1.0, alpha * 0.68))", ".text_size(px(15.5))\n                    .text_color(hsla(0.0, 0.0, 1.0, 0.68))")
          replace_once(player, "                .py(px(9.0))\n                .mb(px(8.0))\n                .opacity(if index == active { 1.0 } else { 0.96 })\n                .cursor_pointer()", "                .py(px(9.0))\n                .mb(px(8.0))\n                .scale(scale)\n                .opacity(alpha)\n                .transition(lyric_focus_transition())\n                .cursor_pointer()")
          replace_once(player, "                        this.seek_to_ms(timestamp, cx);\n                        this.lyrics_user_scrolling_until = None;\n                        this.lyrics_scroll_handle\n                            .scroll_to_top_of_item(index.saturating_sub(2));\n                        this.wake_stage_controls_immediately(cx);", "                        this.seek_to_ms(timestamp, cx);\n                        this.lyrics_user_scrolling_until = None;\n                        this.last_lyric_index = Some(index);\n                        this.lyrics_scroll_target_y =\n                            Some(f32::from(this.lyrics_scroll_handle.offset().y));\n                        this.wake_stage_controls_immediately(cx);")

          helper = "\n".join([
              "fn lyric_focus_transition() -> Transition {",
              "    Transition::new(Duration::from_millis(360))",
              "        .ease(Easing::OutCubic)",
              "        .properties([TransitionProperty::Opacity, TransitionProperty::Transform])",
              "}",
              "",
          ])
          replace_once(player, "fn stage_controls(\n", helper + "fn stage_controls(\n")

          p = Path(player)
          text = p.read_text(encoding="utf-8")
          start_marker = "    // Move the cached blur surface itself."
          start = text.index(start_marker)
          end = text.index("\n}\n\nfn ambient_palette", start)
          fluid = "\n".join([
              "    // Keep the Gaussian blur surface cached. An off-centre blob rotating inside a non-square",
              "    // orbit follows a real ellipse; a slower outer translation prevents the motion from reading",
              "    // as a mechanical rotation. Both properties stay renderer-owned and avoid relayout/reblur.",
              "    let rotation = Animation::from_spec(",
              "        AnimationSpec::new(Duration::from_secs(period_seconds))",
              "            .repeat(RepeatMode::Forever)",
              "            .ease(Easing::Linear),",
              "    )",
              "    .with_property(AnimationProperty::rotation(",
              "        radians(0.0),",
              "        radians(std::f32::consts::TAU * direction),",
              "    ));",
              "    let orbit = orbit.with_animation(",
              "        SharedString::from(format!(\"{animation_id}-rotation\")),",
              "        rotation,",
              "        |element, _| element,",
              "    );",
              "",
              "    let drift_spec = AnimationSpec::new(Duration::from_secs(period_seconds + 4))",
              "        .repeat(RepeatMode::Forever)",
              "        .direction(AnimationDirection::Alternate)",
              "        .ease(Easing::Linear);",
              "    let dx = drift_x * direction;",
              "    let translation = Animation::from_spec(drift_spec).with_property(",
              "        AnimationProperty::translation(",
              "            point(px(-dx), px(-drift_y)),",
              "            point(px(dx), px(drift_y)),",
              "        ),",
              "    );",
              "",
              "    orbit",
              "        .with_animation(animation_id, translation, |element, _| element)",
              "        .into_any_element()",
          ])
          p.write_text(text[:start] + fluid + text[end:], encoding="utf-8")

          replace_once(shell, "    pub(crate) lyrics_user_scrolling_until: Option<std::time::Instant>,\n    pub(crate) library_scroll_handle: gpui::UniformListScrollHandle,", "    pub(crate) lyrics_user_scrolling_until: Option<std::time::Instant>,\n    pub(crate) lyrics_scroll_target_y: Option<f32>,\n    pub(crate) library_scroll_handle: gpui::UniformListScrollHandle,")
          replace_once(shell, "            lyrics_user_scrolling_until: None,\n            library_scroll_handle: gpui::UniformListScrollHandle::new(),", "            lyrics_user_scrolling_until: None,\n            lyrics_scroll_target_y: None,\n            library_scroll_handle: gpui::UniformListScrollHandle::new(),")

          scroll_methods = "\n".join([
              "    fn advance_lyrics_scroll_animation(&mut self, dt: f32) {",
              "        if !self.stage_open {",
              "            self.lyrics_scroll_target_y = None;",
              "            return;",
              "        }",
              "        if self",
              "            .lyrics_user_scrolling_until",
              "            .is_some_and(|until| std::time::Instant::now() < until)",
              "        {",
              "            self.lyrics_scroll_target_y = None;",
              "            return;",
              "        }",
              "        let Some(index) = self.last_lyric_index else {",
              "            self.lyrics_scroll_target_y = None;",
              "            return;",
              "        };",
              "        let viewport = self.lyrics_scroll_handle.bounds();",
              "        let Some(line) = self.lyrics_scroll_handle.bounds_for_item(index) else {",
              "            self.lyrics_scroll_target_y = Some(f32::from(self.lyrics_scroll_handle.offset().y));",
              "            return;",
              "        };",
              "        let max_offset = f32::from(self.lyrics_scroll_handle.max_offset().height).max(0.0);",
              "        let target = f32::from(viewport.center().y - line.center().y).clamp(-max_offset, 0.0);",
              "        self.lyrics_scroll_target_y = Some(target);",
              "",
              "        let offset = self.lyrics_scroll_handle.offset();",
              "        let current = f32::from(offset.y);",
              "        let diff = target - current;",
              "        if diff.abs() <= 0.35 {",
              "            self.lyrics_scroll_handle",
              "                .set_offset(gpui::Point::new(offset.x, gpui::px(target)));",
              "            return;",
              "        }",
              "",
              "        let factor = 1.0 - (-13.5 * dt).exp();",
              "        let next = current + diff * factor;",
              "        self.lyrics_scroll_handle",
              "            .set_offset(gpui::Point::new(offset.x, gpui::px(next)));",
              "    }",
              "",
              "    pub(crate) fn has_active_animations(&self) -> bool {",
              "        let lyrics_scrolling = self.stage_open",
              "            && self.lyrics_scroll_target_y.is_some_and(|target| {",
              "                (target - f32::from(self.lyrics_scroll_handle.offset().y)).abs() > 0.35",
              "            });",
              "        self.stage_animating",
              "            || (self.stage_open",
              "                && (self.stage_controls_visibility > 0.005",
              "                    && self.stage_controls_visibility < 0.995))",
              "            || lyrics_scrolling",
              "    }",
          ])
          old_has_active = "\n".join([
              "    pub(crate) fn has_active_animations(&self) -> bool {",
              "        self.stage_animating",
              "            || (self.stage_open",
              "                && (self.stage_controls_visibility > 0.005",
              "                    && self.stage_controls_visibility < 0.995))",
              "    }",
          ])
          replace_once(shell, old_has_active, scroll_methods)

          replace_once(shell, "                self.last_lyric_index = None;\n                self.lyrics_user_scrolling_until = None;\n                self.lyrics_scroll_handle.scroll_to_item(0);", "                self.last_lyric_index = None;\n                self.lyrics_user_scrolling_until = None;\n                self.lyrics_scroll_target_y = None;\n                self.lyrics_scroll_handle.scroll_to_item(0);")
          replace_once(shell, "                        if !in_user_scroll {\n                            self.lyrics_scroll_handle\n                                .scroll_to_top_of_item(current_idx.saturating_sub(2));\n                        }", "                        if !in_user_scroll {\n                            self.lyrics_scroll_target_y =\n                                Some(f32::from(self.lyrics_scroll_handle.offset().y));\n                        }")
          replace_once(shell, "        } else {\n            self.stage_controls_visibility = target_visibility;\n        }\n\n        if self.has_active_animations() {", "        } else {\n            self.stage_controls_visibility = target_visibility;\n        }\n\n        self.advance_lyrics_scroll_animation(dt);\n\n        if self.has_active_animations() {")
          PY

          cargo fmt
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-player-motion-20260905.yml
          rm .github/workflows/recover-player-motion-20260905.yml
          git add src/ui/player_stage.rs src/ui/shell.rs .github/workflows/fix-player-motion-20260905.yml .github/workflows/recover-player-motion-20260905.yml
          git commit -m "fix(player): 恢复歌词动效并增强流体背景"
          git push origin HEAD:main
