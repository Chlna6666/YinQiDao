name: Apply stage input and FBM fix v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-stage-input-fbm-v2-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply source changes
        shell: bash
        run: |
          python .github/scripts/apply-stage-input-fbm-20260905.py
          python .github/scripts/fix-stage-input-fbm-20260905.py
          python .github/scripts/fix-slider-bounds-probe-20260905.py

      - name: Format
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Check
        shell: bash
        run: cargo check --locked

      - name: Clippy
        shell: bash
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        shell: bash
        timeout-minutes: 18
        run: cargo test --locked

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/scripts/apply-stage-input-fbm-20260905.py
          rm .github/scripts/fix-stage-input-fbm-20260905.py
          rm .github/scripts/fix-slider-bounds-probe-20260905.py
          rm .github/workflows/apply-stage-input-fbm-20260905.yml
          rm .github/workflows/apply-stage-input-fbm-v2-20260905.yml
          git config user.name "Chlna6666"
          git config user.email "79357769+Chlna6666@users.noreply.github.com"
          git add src .github/scripts/apply-stage-input-fbm-20260905.py .github/scripts/fix-stage-input-fbm-20260905.py .github/scripts/fix-slider-bounds-probe-20260905.py .github/workflows/apply-stage-input-fbm-20260905.yml .github/workflows/apply-stage-input-fbm-v2-20260905.yml
          git commit -m "fix(player): 修正滑块交互并重构 FBM 沉浸背景"
          git push origin HEAD:main
