name: Validate player motion fix on Windows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-player-motion-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply patch and run project checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/recover-player-motion-20260905.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, '<player-motion-patch>', 'exec'))
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-player-motion-20260905.yml
          rm .github/workflows/recover-player-motion-20260905.yml
          rm .github/workflows/windows-player-motion-20260905.yml
          git add src/ui/player_stage.rs src/ui/shell.rs .github/workflows/fix-player-motion-20260905.yml .github/workflows/recover-player-motion-20260905.yml .github/workflows/windows-player-motion-20260905.yml
          git commit -m "fix(player): 恢复歌词动效并增强流体背景"
          git push origin HEAD:main
