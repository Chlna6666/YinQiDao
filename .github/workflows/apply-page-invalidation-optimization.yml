name: Apply page invalidation optimization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-page-invalidation-optimization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply invalidation optimization
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ui/shell.rs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"expected source block not found: {old[:160]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "    config_save_dirty: bool,\n    last_config_save_at: std::time::Instant,\n    home_page: Option<Entity<HomePage>>,",
              "    config_save_dirty: bool,\n    last_config_save_at: std::time::Instant,\n    ui_content_revision: u64,\n    home_page: Option<Entity<HomePage>>,")

          start = text.index("struct HomePage {")
          end = text.index("impl Render for LibraryPage {")
          page_views = r'''#[derive(Clone, Copy, Debug, Eq, PartialEq)]
          struct HomePageRenderKey {
              active: bool,
              content_revision: u64,
              scan_in_progress: bool,
              current_track: Option<TrackId>,
              playback_state: PlaybackState,
          }

          fn home_page_render_key(app: &MusicApp) -> HomePageRenderKey {
              HomePageRenderKey {
                  active: app.page == AppPage::Home,
                  content_revision: app.ui_content_revision,
                  scan_in_progress: app.scan_in_progress,
                  current_track: app.snapshot.current_track.as_ref().map(|track| track.id),
                  playback_state: app.snapshot.state,
              }
          }

          #[inline]
          fn text_fingerprint(text: &str) -> u64 {
              let mut hash = 0xcbf2_9ce4_8422_2325_u64;
              for byte in text.bytes() {
                  hash ^= u64::from(byte);
                  hash = hash.wrapping_mul(0x0000_0100_0000_01b3);
              }
              hash
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          struct LibraryPageRenderKey {
              active: bool,
              content_revision: u64,
              query_revision: u64,
              status_fingerprint: u64,
              tab: LibraryTab,
              search_active: bool,
              scan_in_progress: bool,
              current_track: Option<TrackId>,
              playback_state: PlaybackState,
          }

          fn library_page_render_key(app: &MusicApp) -> LibraryPageRenderKey {
              LibraryPageRenderKey {
                  active: app.page == AppPage::Library,
                  content_revision: app.ui_content_revision,
                  query_revision: app.library_refresh_request,
                  status_fingerprint: text_fingerprint(&app.status),
                  tab: app.library_tab,
                  search_active: app.search_active,
                  scan_in_progress: app.scan_in_progress,
                  current_track: app.snapshot.current_track.as_ref().map(|track| track.id),
                  playback_state: app.snapshot.state,
              }
          }

          struct HomePage {
              parent: WeakEntity<MusicApp>,
              last_key: HomePageRenderKey,
              _subscription: Subscription,
          }

          impl HomePage {
              fn new(parent: Entity<MusicApp>, cx: &mut Context<Self>) -> Self {
                  let last_key = home_page_render_key(parent.read(cx));
                  let subscription = cx.observe(&parent, |this, parent, cx| {
                      let next_key = home_page_render_key(parent.read(cx));
                      if next_key != this.last_key {
                          this.last_key = next_key;
                          if next_key.active {
                              cx.notify();
                          }
                      }
                  });
                  Self {
                      parent: parent.downgrade(),
                      last_key,
                      _subscription: subscription,
                  }
              }
          }

          impl Render for HomePage {
              fn render(&mut self, _window: &mut Window, cx: &mut Context<Self>) -> impl IntoElement {
                  let Some(parent) = self.parent.upgrade() else {
                      return div().into_any_element();
                  };
                  let app = parent.read(cx);
                  home::render(app, &self.parent)
              }
          }

          struct LibraryPage {
              parent: WeakEntity<MusicApp>,
              last_key: LibraryPageRenderKey,
              _subscription: Subscription,
          }

          impl LibraryPage {
              fn new(parent: Entity<MusicApp>, cx: &mut Context<Self>) -> Self {
                  let last_key = library_page_render_key(parent.read(cx));
                  let subscription = cx.observe(&parent, |this, parent, cx| {
                      let next_key = library_page_render_key(parent.read(cx));
                      if next_key != this.last_key {
                          this.last_key = next_key;
                          if next_key.active {
                              cx.notify();
                          }
                      }
                  });
                  Self {
                      parent: parent.downgrade(),
                      last_key,
                      _subscription: subscription,
                  }
              }
          }

          '''
          page_views = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in page_views.splitlines()
          ) + "\n"
          text = text[:start] + page_views + text[end:]

          replace_once(
              "            config_save_dirty: false,\n            last_config_save_at: std::time::Instant::now() - Duration::from_secs(1),\n            home_page: None,",
              "            config_save_dirty: false,\n            last_config_save_at: std::time::Instant::now() - Duration::from_secs(1),\n            ui_content_revision: 0,\n            home_page: None,")

          replace_once(
              "    fn ensure_home_page(&mut self, cx: &mut Context<Self>) -> Entity<HomePage> {",
              "    #[inline]\n    fn bump_ui_content_revision(&mut self) {\n        self.ui_content_revision = self.ui_content_revision.wrapping_add(1);\n    }\n\n    fn ensure_home_page(&mut self, cx: &mut Context<Self>) -> Entity<HomePage> {")

          replace_once(
              "            self.config.queue = queue.clone();\n            self.send(PlayerCommand::SetQueue(queue));",
              "            self.config.queue = queue.clone();\n            self.bump_ui_content_revision();\n            self.send(PlayerCommand::SetQueue(queue));")
          replace_once(
              "        if let Some(palette) = palette {\n            self.artwork_palettes.insert(track_id, palette);\n        }\n    }",
              "        if let Some(palette) = palette {\n            self.artwork_palettes.insert(track_id, palette);\n        }\n        self.bump_ui_content_revision();\n    }")
          replace_once(
              "            self.config.queue = queue;\n            self.queue_matches_tracks = true;",
              "            self.config.queue = queue;\n            self.bump_ui_content_revision();\n            self.queue_matches_tracks = true;")
          replace_once(
              "            Arc::make_mut(&mut self.config.queue).push(track_id);\n            self.queue_matches_tracks = false;",
              "            Arc::make_mut(&mut self.config.queue).push(track_id);\n            self.bump_ui_content_revision();\n            self.queue_matches_tracks = false;")
          replace_once(
              "        Arc::make_mut(&mut self.config.queue).retain(|id| *id != track_id);\n        self.queue_matches_tracks = false;",
              "        let old_len = self.config.queue.len();\n        Arc::make_mut(&mut self.config.queue).retain(|id| *id != track_id);\n        if self.config.queue.len() != old_len {\n            self.bump_ui_content_revision();\n        }\n        self.queue_matches_tracks = false;")
          replace_once(
              "        Arc::make_mut(&mut self.config.queue).clear();\n        self.queue_matches_tracks = self.tracks.is_empty();",
              "        if !self.config.queue.is_empty() {\n            Arc::make_mut(&mut self.config.queue).clear();\n            self.bump_ui_content_revision();\n        }\n        self.queue_matches_tracks = self.tracks.is_empty();")
          replace_once(
              "                        this.tracks = tracks;\n                        this.queue_matches_tracks = false;",
              "                        this.tracks = tracks;\n                        this.bump_ui_content_revision();\n                        this.queue_matches_tracks = false;")

          test_anchor = "    #[test]\n    fn test_drag_progress_ratio_precedence() {\n"
          tests = r'''    #[test]
          fn page_render_keys_ignore_transport_only_updates() {
              let mut app = MusicApp::new(false);
              app.page = AppPage::Home;
              let home_key = home_page_render_key(&app);
              app.snapshot.position_ms = app.snapshot.position_ms.saturating_add(1_000);
              app.config.volume = 0.23;
              app.drag_progress_ratio = Some(0.42);
              app.drag_volume_ratio = Some(0.61);
              assert_eq!(home_key, home_page_render_key(&app));

              app.page = AppPage::Library;
              let library_key = library_page_render_key(&app);
              app.snapshot.position_ms = app.snapshot.position_ms.saturating_add(1_000);
              app.config.volume = 0.77;
              app.drag_progress_ratio = Some(0.11);
              app.drag_volume_ratio = Some(0.88);
              assert_eq!(library_key, library_page_render_key(&app));
          }

          #[test]
          fn page_render_keys_track_visible_content_changes() {
              let mut app = MusicApp::new(false);
              app.page = AppPage::Home;
              let home_key = home_page_render_key(&app);
              app.bump_ui_content_revision();
              assert_ne!(home_key, home_page_render_key(&app));

              app.page = AppPage::Library;
              let library_key = library_page_render_key(&app);
              app.library_tab = LibraryTab::Albums;
              assert_ne!(library_key, library_page_render_key(&app));

              let status_key = library_page_render_key(&app);
              app.status.push_str(" · updated");
              assert_ne!(status_key, library_page_render_key(&app));
          }

          #[test]
          fn test_drag_progress_ratio_precedence() {
          '''
          tests = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in tests.splitlines()
          ) + "\n"
          replace_once(test_anchor, tests)

          path.write_text(text, encoding="utf-8")

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/shell.rs
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'no invalidation optimization generated' >&2
            exit 1
          }
          git commit -m 'perf(ui): 按可见内容签名收窄页面失效'
          git push origin HEAD:main
