name: Temporary native GPUI lock resolution
on:
  push:
    paths:
      - .github/workflows/temp-native-gpui-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve new gpui-3d and gfx-core graph with Cargo
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit canonical resolved lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build(deps): resolve native gpui-3d and shader compiler dependencies"
            git push origin HEAD:main
          fi
