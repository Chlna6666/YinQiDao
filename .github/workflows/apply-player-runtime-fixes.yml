name: Apply player runtime fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-player-runtime-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply source fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Main volume must be applied after the decoded ring buffer. Otherwise already-buffered
          # PCM carries the old gain for roughly 125 ms and volume dragging feels delayed.
          replace_once(
              "src/audio/engine.rs",
              "atomic::{AtomicBool, Ordering}",
              "atomic::{AtomicBool, AtomicU32, Ordering}",
          )
          replace_once(
              "src/audio/engine.rs",
              "dsp::AudioProcessor,",
              "dsp::{AudioProcessor, perceptual_volume_gain},",
          )
          replace_once(
              "src/audio/engine.rs",
              "    paused: Arc<AtomicBool>,\n    flush: Arc<AtomicBool>,\n    _stream: Stream,",
              "    paused: Arc<AtomicBool>,\n    flush: Arc<AtomicBool>,\n    output_gain: Arc<AtomicU32>,\n    _stream: Stream,",
          )
          replace_once(
              "src/audio/engine.rs",
              "        let flush = Arc::new(AtomicBool::new(false));\n        let paused = Arc::new(AtomicBool::new(false));\n        let stream = build_output_stream(\n            &device,\n            &supported,\n            consumer,\n            flush.clone(),\n            paused.clone(),\n            event_tx.clone(),\n        )?;",
              "        let flush = Arc::new(AtomicBool::new(false));\n        let paused = Arc::new(AtomicBool::new(false));\n        let output_gain = Arc::new(AtomicU32::new(volume.clamp(0.0, 1.0).to_bits()));\n        let stream = build_output_stream(\n            &device,\n            &supported,\n            consumer,\n            flush.clone(),\n            paused.clone(),\n            output_gain.clone(),\n            event_tx.clone(),\n        )?;",
          )
          replace_once(
              "src/audio/engine.rs",
              "                    AudioWorkerConfig {\n                        output_rate,\n                        volume,\n                        eq,\n                        spatial,\n                    },",
              "                    AudioWorkerConfig {\n                        output_rate,\n                        eq,\n                        spatial,\n                    },",
          )
          replace_once(
              "src/audio/engine.rs",
              "            paused,\n            flush,\n            _stream: stream,",
              "            paused,\n            flush,\n            output_gain,\n            _stream: stream,",
          )
          replace_once(
              "src/audio/engine.rs",
              "            PlayerCommand::SetVolume(volume) => {\n                let volume = volume.clamp(0.0, 1.0);\n                if let Ok(mut snapshot) = self.snapshot.write() {\n                    snapshot.volume = volume;\n                }\n            }",
              "            PlayerCommand::SetVolume(volume) => {\n                let volume = volume.clamp(0.0, 1.0);\n                self.output_gain.store(volume.to_bits(), Ordering::Release);\n                if let Ok(mut snapshot) = self.snapshot.write() {\n                    snapshot.volume = volume;\n                }\n            }",
          )
          replace_once(
              "src/audio/engine.rs",
              "struct AudioWorkerConfig {\n    output_rate: u32,\n    volume: f32,\n    eq: EqSettings,",
              "struct AudioWorkerConfig {\n    output_rate: u32,\n    eq: EqSettings,",
          )
          replace_once(
              "src/audio/engine.rs",
              "            processor: AudioProcessor::new(\n                config.output_rate,\n                config.eq,\n                config.spatial,\n                config.volume,\n            ),",
              "            // Main volume is a post-buffer output gain. Keep decoded PCM at unity so\n            // a new volume value can affect the very next device callback instead of waiting for\n            // the ring buffer to drain.\n            processor: AudioProcessor::new(\n                config.output_rate,\n                config.eq,\n                config.spatial,\n                1.0,\n            ),",
          )
          replace_once(
              "src/audio/engine.rs",
              "            PlayerCommand::SetVolume(volume) => {\n                let volume = volume.clamp(0.0, 1.0);\n                self.processor.set_volume(volume);\n                if let Ok(mut snapshot) = self.snapshot.write() {\n                    snapshot.volume = volume;\n                }\n            }",
              "            PlayerCommand::SetVolume(volume) => {\n                let volume = volume.clamp(0.0, 1.0);\n                if let Ok(mut snapshot) = self.snapshot.write() {\n                    snapshot.volume = volume;\n                }\n            }",
          )
          replace_once(
              "src/audio/engine.rs",
              "    paused: Arc<AtomicBool>,\n    event_tx: Sender<PlayerEvent>,\n) -> Result<Stream> {",
              "    paused: Arc<AtomicBool>,\n    output_gain: Arc<AtomicU32>,\n    event_tx: Sender<PlayerEvent>,\n) -> Result<Stream> {",
          )
          replace_once(
              "src/audio/engine.rs",
              "            move |data: &mut [f32], _| fill_f32(data, channels, &mut consumer, &flush, &paused),",
              "            move |data: &mut [f32], _| {\n                fill_f32(data, channels, &mut consumer, &flush, &paused);\n                let gain = current_output_gain(&output_gain);\n                if gain != 1.0 {\n                    for sample in data {\n                        *sample *= gain;\n                    }\n                }\n            },",
          )
          replace_once(
              "src/audio/engine.rs",
              "            move |data: &mut [i16], _| fill_i16(data, channels, &mut consumer, &flush, &paused),",
              "            move |data: &mut [i16], _| {\n                fill_i16(data, channels, &mut consumer, &flush, &paused);\n                let gain = current_output_gain(&output_gain);\n                if gain != 1.0 {\n                    for sample in data {\n                        *sample = ((*sample as f32 * gain)\n                            .round()\n                            .clamp(i16::MIN as f32, i16::MAX as f32))\n                            as i16;\n                    }\n                }\n            },",
          )
          replace_once(
              "src/audio/engine.rs",
              "            move |data: &mut [u16], _| fill_u16(data, channels, &mut consumer, &flush, &paused),",
              "            move |data: &mut [u16], _| {\n                fill_u16(data, channels, &mut consumer, &flush, &paused);\n                let gain = current_output_gain(&output_gain);\n                if gain != 1.0 {\n                    const CENTER: f32 = 32768.0;\n                    for sample in data {\n                        let centered = *sample as f32 - CENTER;\n                        *sample = (CENTER + centered * gain)\n                            .round()\n                            .clamp(0.0, u16::MAX as f32)\n                            as u16;\n                    }\n                }\n            },",
          )
          replace_once(
              "src/audio/engine.rs",
              "fn read_stereo(consumer: &mut ringbuf::HeapCons<f32>) -> (f32, f32) {",
              "#[inline]\nfn current_output_gain(output_gain: &AtomicU32) -> f32 {\n    perceptual_volume_gain(f32::from_bits(output_gain.load(Ordering::Acquire)))\n}\n\nfn read_stereo(consumer: &mut ringbuf::HeapCons<f32>) -> (f32, f32) {",
          )
          replace_once(
              "src/audio/dsp.rs",
              "fn perceptual_volume_gain(volume: f32) -> f32 {",
              "pub(crate) fn perceptual_volume_gain(volume: f32) -> f32 {",
          )

          # AudioWorkerConfig is also instantiated by engine unit tests.
          tests = Path("src/audio/engine_tests.rs")
          text = tests.read_text(encoding="utf-8")
          count = text.count("            volume: 1.0,\n")
          if count != 2:
              raise SystemExit(f"expected two AudioWorkerConfig volume fields in tests, found {count}")
          tests.write_text(text.replace("            volume: 1.0,\n", ""), encoding="utf-8")

          # Make the stage fluid field visibly move: the old blobs were almost exactly centered in
          # their rotating orbit boxes. Capture each expensive blurred blob once as a compositor
          # layer, then rotate the off-center layer continuously on the renderer side.
          replace_once(
              "src/ui/player_stage.rs",
              "    Animation, AnimationExt as _, AnimationProperty, AnimationSpec, Context, Easing,",
              "    Animation, AnimationExt as _, AnimationProperty, AnimationSpec, CompositeLayerExt as _,\n    Context, Easing,",
          )
          replace_once(
              "src/ui/player_stage.rs",
              "            app.config.blur_radius,\n            snapshot.state == PlaybackState::Playing,\n        ))",
              "            app.config.blur_radius,\n        ))",
          )
          replace_once(
              "src/ui/player_stage.rs",
              "    dynamic: bool,\n    blur_radius: f32,\n    playing: bool,\n) -> impl IntoElement {\n    let id = id.unwrap_or_default();\n    let animate = dynamic && playing;",
              "    dynamic: bool,\n    blur_radius: f32,\n) -> impl IntoElement {\n    let id = id.unwrap_or_default();\n    // Keep the Apple Music-style field alive while the immersive stage is open, including\n    // paused playback. Dynamic blur controls whether the field is animated at all.\n    let animate = dynamic;",
          )

          stage = Path("src/ui/player_stage.rs")
          text = stage.read_text(encoding="utf-8")
          replacements = {
              "            0.08,\n            0.13,\n            0.82,\n            0.74,": "            0.02,\n            0.03,\n            0.68,\n            0.58,",
              "            29,\n            1.0,": "            17,\n            1.0,",
              "            0.12,\n            0.05,\n            0.76,\n            0.82,": "            0.30,\n            0.08,\n            0.62,\n            0.64,",
              "            37,\n            -1.0,": "            23,\n            -1.0,",
              "            0.04,\n            0.10,\n            0.84,\n            0.76,": "            0.10,\n            0.32,\n            0.66,\n            0.58,",
              "            43,\n            1.0,": "            31,\n            1.0,",
              "        .h(relative(height))\n        .child(blob);": "        .h(relative(height))\n        .child(blob)\n        .composite_layer();",
              "    // Built-in easing is GPU/scene-driver friendly. The asymmetric child makes local rotation look\n    // like a slow drift while the container's dirty envelope stays local. 29/37/43 are pairwise\n    // coprime, so the composite pattern has a long repeat period without a CPU animation loop.": "    // The child is deliberately off-center, so a retained compositor rotation becomes visible\n    // orbital drift instead of spinning an almost symmetric blob in place. 17/23/31 are pairwise\n    // coprime, keeping a long composite repeat period without a CPU animation loop.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected stage block not found: {old[:100]!r}")
              text = text.replace(old, new, 1)
          stage.write_text(text, encoding="utf-8")

      - name: Resolve complete retained context fix
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p gpui --precise bfe0f7efb999e53e470697d825e76e006af17a78
          grep -q 'bfe0f7efb999e53e470697d825e76e006af17a78' Cargo.lock
          if grep -q 'd546c984d6b53acf17b8717cabaffcdd57ad4e8d' Cargo.lock; then
            echo 'old incomplete retained context commit is still present' >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src/audio/engine.rs src/audio/engine_tests.rs src/audio/dsp.rs src/ui/player_stage.rs
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'no runtime fix changes generated' >&2
            exit 1
          }
          git commit -m 'fix(player): 修复文字复用、流体动画与音量延迟'
          git push origin HEAD:main
